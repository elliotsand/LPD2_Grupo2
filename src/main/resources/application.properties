spring.application.name=ProyectoFinal
# Configuracion de la conexion a MySQL.
# En local usa los valores por defecto; en Azure se definen como variables de entorno
# (App Service > Configuracion): DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BDHotel}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA - Hibernate: las tablas se crean con BDHotel.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
# Puerto: 8083 en local; Azure define PORT
server.port=${PORT:8083}
# Gestion de sesiones: expiran tras 20 minutos sin actividad
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
