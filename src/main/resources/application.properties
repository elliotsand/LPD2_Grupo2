spring.application.name=ProyectoFinal
# configuracion de la conexion a MYSQL
# URL de conexion: servidor, puerto y nombre de la BD
spring.datasource.url=jdbc:mysql://localhost:3306/BDHotel
# usuario de MYSQL
spring.datasource.username=root
# Clave del usuario mysql
spring.datasource.password=root
# Driver JDBC que permite comunicarse con Mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# configuracion de JPA - HIBERNATE
# No crear, modificar ni eliminar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=none
#Mostrar en consola las sentencias SQL
spring.jpa.show-sql=true
# dar formato legible a las sentencias SQL
spring.jpa.properties.hibernate.format_sql=true
server.port=8083
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
