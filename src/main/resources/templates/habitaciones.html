
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Habitaciones | Hotel Los Andes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Hotel Los Andes</span>
        <a th:href="@{/inicio}" class="btn btn-outline-light btn-sm">
            Volver al inicio
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Habitaciones</h2>
            <p class="text-secondary mb-0">
                Administra las habitaciones del hotel.
            </p>
        </div>

        <a th:href="@{/habitaciones/nuevo}" class="btn btn-primary">
            Nueva habitación
        </a>
    </div>

    <div th:if="${param.error == 'reservas'}" class="alert alert-warning">
        No se puede eliminar esta habitación porque tiene reservas asociadas.
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Número</th>
                        <th>Piso</th>
                        <th>Tipo</th>
                        <th>Precio por noche</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="habitacion : ${habitaciones}">
                        <td th:text="${habitacion.idHabitacion}"></td>
                        <td th:text="${habitacion.numero}"></td>
                        <td th:text="${habitacion.piso}"></td>
                        <td th:text="${habitacion.tipoHabitacion.nombre}"></td>
                        <td th:text="${'S/ ' + #numbers.formatDecimal(habitacion.tipoHabitacion.precio, 1, 2)}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${habitacion.estado == 'DISPONIBLE'} ? ' bg-success' : ' bg-secondary'"
                                  th:text="${habitacion.estado}">
                            </span>
                        </td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/habitaciones/editar/{id}(id=${habitacion.idHabitacion})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <form th:action="@{/habitaciones/eliminar/{id}(id=${habitacion.idHabitacion})}"
                                      method="post"
                                      onsubmit="return confirm('¿Seguro que deseas eliminar esta habitación?')">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(habitaciones)}">
                        <td colspan="7" class="text-center text-secondary py-4">
                            No hay habitaciones registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

</body>
</html>
