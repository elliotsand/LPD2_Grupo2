
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${accion} + ' habitación'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Hotel Los Andes</span>
        <a th:href="@{/habitaciones}" class="btn btn-outline-light btn-sm">
            Volver al listado
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4 p-md-5">

            <h2 class="fw-bold mb-4"
                th:text="${accion} + ' habitación'"></h2>
				
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/habitaciones/guardar}"
                  th:object="${habitacion}" method="post">

                <input type="hidden" th:field="*{idHabitacion}">

                <div class="mb-3">
                    <label for="numero" class="form-label">Número de habitación</label>
                    <input type="text" id="numero" th:field="*{numero}"
                           class="form-control" maxlength="10" required>
                </div>

                <div class="mb-3">
                    <label for="piso" class="form-label">Piso</label>
                    <input type="number" id="piso" th:field="*{piso}"
                           class="form-control" min="1" required>
                </div>

                <div class="mb-3">
                    <label for="idTipoHabitacion" class="form-label">
                        Tipo de habitación
                    </label>

                    <select id="idTipoHabitacion" name="idTipoHabitacion"
                            class="form-select" required>
                        <option value="">Selecciona un tipo</option>

                        <option th:each="tipo : ${tipos}"
                                th:value="${tipo.idTipoHabitacion}"
                                th:text="${tipo.nombre}"
                                th:selected="${habitacion.tipoHabitacion != null and habitacion.tipoHabitacion.idTipoHabitacion == tipo.idTipoHabitacion}">
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="estado" class="form-label">Estado</label>

                    <select id="estado" th:field="*{estado}"
                            class="form-select" required>
                        <option value="DISPONIBLE">Disponible</option>
                        <option value="RESERVADA">Reservada</option>
                        <option value="OCUPADA">Ocupada</option>
                        <option value="MANTENIMIENTO">Mantenimiento</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${accion}"></button>
                    <a th:href="@{/habitaciones}"
                       class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>
</main>

</body>
</html>
