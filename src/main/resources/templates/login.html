
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Hotel Los Andes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow border-0 rounded-4" style="max-width: 420px; width: 100%;">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Hotel Los Andes</h2>
                <p class="text-secondary mb-0">Sistema de gestión hotelera</p>
            </div>

            <h4 class="text-center mb-4">Iniciar sesión</h4>

            <div th:if="${error}"
                 class="alert alert-danger"
                 role="alert"
                 th:text="${error}">
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="username"
                           name="username"
                           placeholder="Ingresa tu usuario"
                           required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password"
                           class="form-control form-control-lg"
                           id="password"
                           name="password"
                           placeholder="Ingresa tu contraseña"
                           required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    Ingresar
                </button>

            </form>

            <p class="text-center text-secondary small mt-4 mb-0">
                Hotel Los Andes © 2026
            </p>

        </div>
    </div>

</div>

</body>
</html>
