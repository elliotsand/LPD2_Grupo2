
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tipos de habitación | Hotel Los Andes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Hotel Los Andes</span>
        <a th:href="@{/inicio}" class="btn btn-outline-light btn-sm">
            Volver al inicio
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Tipos de habitación</h2>
            <p class="text-secondary mb-0">
                Administra los tipos y sus precios.
            </p>
        </div>

        <a th:href="@{/tipos-habitacion/nuevo}" class="btn btn-primary">
            Nuevo tipo
        </a>
    </div>

    <div th:if="${param.error == 'habitaciones'}" class="alert alert-warning">
        No se puede eliminar este tipo porque tiene habitaciones asociadas.
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio por noche</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="tipo : ${tipos}">
                        <td th:text="${tipo.idTipoHabitacion}"></td>
                        <td th:text="${tipo.nombre}"></td>
                        <td th:text="${'S/ ' + #numbers.formatDecimal(tipo.precio, 1, 2)}"></td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/tipos-habitacion/editar/{id}(id=${tipo.idTipoHabitacion})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <form th:action="@{/tipos-habitacion/eliminar/{id}(id=${tipo.idTipoHabitacion})}"
                                      method="post"
                                      onsubmit="return confirm('¿Seguro que deseas eliminar este tipo de habitación?')">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(tipos)}">
                        <td colspan="4" class="text-center text-secondary py-4">
                            No hay tipos de habitación registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
