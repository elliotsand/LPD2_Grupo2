<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inicio | Hotel Los Andes</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-primary shadow-sm">
		<div class="container">
			<span class="navbar-brand fw-bold">Hotel Los Andes</span>

			<div class="d-flex align-items-center gap-3">
				<span class="text-white" th:text="${usuario.nombre}"></span>

				<a th:href="@{/logout}" class="btn btn-outline-light btn-sm">
					Cerrar sesión
				</a>
			</div>
		</div>
	</nav>

	<main class="container py-5">

		<div th:if="${errorPermiso}" class="alert alert-warning" th:text="${errorPermiso}">
		</div>

		<div class="card border-0 shadow-sm rounded-4">
			<div class="card-body p-4 p-md-5">

				<h2 class="fw-bold mb-2">
					Bienvenido, <span th:text="${usuario.nombre}"></span>
				</h2>

				<p class="text-secondary">
					Has iniciado sesión correctamente.
				</p>

				<hr>

				<p class="mb-4">
					<strong>Rol:</strong>
					<span class="badge bg-primary" th:text="${usuario.rol}"></span>
				</p>

				<h5 class="mb-3">Panel principal</h5>

				<div class="row g-3">

					<!-- Mantenimientos: solo administrador -->
					<div class="col-md-6" th:if="${esAdmin}">
						<div class="card h-100 border-0 shadow-sm">
							<div class="card-body">
								<h5 class="fw-bold">Mantenimientos</h5>

								<p class="text-secondary">
									Administración de clientes y tipos de habitación.
								</p>

								<div class="d-flex flex-wrap gap-2">
									<a th:href="@{/clientes}" class="btn btn-outline-primary btn-sm">
										Gestionar clientes
									</a>

									<a th:href="@{/tipos-habitacion}" class="btn btn-outline-primary btn-sm">
										Tipos de habitación
									</a>
									<a th:href="@{/habitaciones}" class="btn btn-outline-primary btn-sm">
										Habitaciones
									</a>
								</div>
							</div>
						</div>
					</div>

					<!-- Reservas: administrador y recepcionista -->
					<div class="col-md-6">
						<div class="card h-100 border-0 shadow-sm">
							<div class="card-body">
								<h5 class="fw-bold">Reservas</h5>

								<p class="text-secondary">
									Registro y consulta de reservas del hotel.
								</p>

								<a th:href="@{/reservas}" class="btn btn-outline-primary">
									Ingresar
								</a>
							</div>
						</div>
					</div>

				</div>

			</div>
		</div>

	</main>

</body>

</html>
