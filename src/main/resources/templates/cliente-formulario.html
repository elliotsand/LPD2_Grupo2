
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${accion} + ' cliente | Hotel Los Andes'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Hotel Los Andes</span>
        <a th:href="@{/clientes}" class="btn btn-outline-light btn-sm">
            Volver al listado
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="card border-0 shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4 p-md-5">

            <h2 class="fw-bold mb-4" th:text="${accion} + ' cliente'"></h2>

            <form th:action="@{/clientes/guardar}"
                  th:object="${cliente}"
                  method="post">

                <input type="hidden" th:field="*{idCliente}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" id="nombre" th:field="*{nombre}"
                           class="form-control" maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="documento" class="form-label">Documento</label>
                    <input type="text" id="documento" th:field="*{documento}"
                           class="form-control" maxlength="20" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" id="telefono" th:field="*{telefono}"
                           class="form-control" maxlength="20">
                </div>

                <div class="mb-4">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" th:field="*{correo}"
                           class="form-control" maxlength="100">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${accion}">
                    </button>
                    <a th:href="@{/clientes}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>
</body>
</html>
