
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | Hotel Los Andes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Hotel Los Andes</span>
        <a th:href="@{/inicio}" class="btn btn-outline-light btn-sm">
            Volver al inicio
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Clientes</h2>
            <p class="text-secondary mb-0">Administración de clientes registrados.</p>
        </div>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">
            Nuevo cliente
        </a>
    </div>

    <div th:if="${param.error == 'reservas'}" class="alert alert-warning">
        No se puede eliminar este cliente porque tiene reservas asociadas.
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.idCliente}"></td>
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.documento}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.correo}"></td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <form th:action="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}"
                                      method="post"
                                      onsubmit="return confirm('¿Seguro que deseas eliminar este cliente?')">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        Eliminar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="6" class="text-center text-secondary py-4">
                            No hay clientes registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
