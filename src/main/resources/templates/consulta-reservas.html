<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consulta de reservas | Hotel Los Andes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Hotel Los Andes</span>
        <a th:href="@{/inicio}" class="btn btn-outline-light btn-sm">Volver al inicio</a>
    </div>
</nav>

<main class="container py-5">
    <h2 class="fw-bold">Consulta de reservas registradas</h2>
    <p class="text-secondary">Filtra por fecha de entrada, estado, habitación o cliente (nombre o documento).</p>
    <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

    <form th:action="@{/consultas/reservas}" method="get" class="card border-0 shadow-sm mb-4">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small" for="desde">Entrada desde</label>
                <input id="desde" type="date" name="desde" class="form-control form-control-sm" th:value="${desde}">
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="hasta">Entrada hasta</label>
                <input id="hasta" type="date" name="hasta" class="form-control form-control-sm" th:value="${hasta}">
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="estado">Estado</label>
                <select id="estado" name="estado" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}" th:selected="${e == estado}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small" for="habitacionId">Habitación</label>
                <select id="habitacionId" name="habitacionId" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option th:each="h : ${habitaciones}" th:value="${h.idHabitacion}" th:text="${h.numero}"
                            th:selected="${h.idHabitacion == habitacionId}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small" for="cliente">Cliente</label>
                <input id="cliente" name="cliente" class="form-control form-control-sm" th:value="${cliente}"
                       placeholder="Nombre o documento">
            </div>
            <div class="col-md-1">
                <button class="btn btn-primary btn-sm w-100">Buscar</button>
            </div>
        </div>
    </form>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                <tr><th>N°</th><th>Cliente</th><th>Documento</th><th>Habitación</th><th>Entrada</th><th>Salida</th>
                    <th class="text-end">Noches</th><th class="text-end">Importe (S/)</th><th>Estado</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservas}">
                    <td th:text="${r.idReserva}"></td>
                    <td th:text="${r.cliente.nombre}"></td>
                    <td th:text="${r.cliente.documento}"></td>
                    <td th:text="${r.habitacion.numero + ' (' + r.habitacion.tipoHabitacion.nombre + ')'}"></td>
                    <td th:text="${#temporals.format(r.fechaEntrada, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(r.fechaSalida, 'dd/MM/yyyy')}"></td>
                    <td class="text-end" th:text="${r.noches}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(r.total, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td><span class="badge"
                              th:classappend="${r.estado == 'CONFIRMADA'} ? 'bg-primary' : (${r.estado == 'FINALIZADA'} ? 'bg-success' : 'bg-secondary')"
                              th:text="${r.estado}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservas)}">
                    <td colspan="9" class="text-center text-secondary py-4">Sin resultados.</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="7" class="text-end">
                        <span th:text="${#lists.size(reservas)}"></span> reserva(s) · importe sin canceladas
                    </th>
                    <th class="text-end" th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</main>
</body>
</html>
