
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${accion} + ' tipo de habitación'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Hotel Los Andes</span>
        <a th:href="@{/tipos-habitacion}" class="btn btn-outline-light btn-sm">
            Volver al listado
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4 p-md-5">

            <h2 class="fw-bold mb-4"
                th:text="${accion} + ' tipo de habitación'"></h2>

            <form th:action="@{/tipos-habitacion/guardar}"
                  th:object="${tipo}" method="post">

                <input type="hidden" th:field="*{idTipoHabitacion}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}"
                           class="form-control" maxlength="50" required>
                </div>

                <div class="mb-4">
                    <label for="precio" class="form-label">
                        Precio por noche (S/)
                    </label>
                    <input type="number" id="precio" th:field="*{precio}"
                           class="form-control" min="0.01" step="0.01"
                           required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${accion}"></button>
                    <a th:href="@{/tipos-habitacion}"
                       class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
